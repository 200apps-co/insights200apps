:root{
  --navy:#33235f; --navy-2:#43307c; --navy-deep:#241a45;
  --pink:#e8318a; --teal:#1fb6b6; --orange:#e8901e; --sky:#3ea0ff; --lime:#7ac74f;
  --bg:#f3eef7;
  --ink:#2b1f4d; --ink-2:#4c4269; --muted:#847b9c; --line:#efeaf5;
  --field:#f7f4fb;
  --ui:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --brand:'Rubik','Assistant',-apple-system,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ui);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:64px 44px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(760px 520px at 50% 34%, #ffffff 0%, rgba(255,255,255,0) 68%),
    radial-gradient(620px 460px at 88% 8%, rgba(232,49,138,.07) 0%, rgba(232,49,138,0) 70%),
    radial-gradient(680px 500px at 8% 96%, rgba(31,182,182,.09) 0%, rgba(31,182,182,0) 70%),
    var(--bg);
}

@media (max-width:1200px){body{padding:40px 20px}.rig{gap:24px;zoom:.84}}
@media (max-width:1000px){.rig{gap:18px;zoom:.66}}

/* ---------- rig ---------- */
.rig{display:flex;align-items:flex-start;gap:32px}
.unit{display:flex;flex-direction:column;align-items:center;gap:20px}
.unit--side{padding-top:112px}
.cap{font-size:13px;font-weight:600;color:#6e6589;letter-spacing:.005em}
.slot{position:relative}
.slot--hero{width:416px;height:870px}
.slot--side{width:300px;height:628px}
.slot .frame{position:absolute;top:0;inset-inline-start:0}
.slot--side .frame{transform:scale(.7212);transform-origin:top right}

.frame{
  width:416px;height:870px;border-radius:56px;padding:13px;
  background:linear-gradient(158deg,#453473 0%,#241a45 42%,#1c1436 70%,#3d2c69 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 0 0 1px rgba(255,255,255,.06),
    0 44px 74px -28px rgba(41,27,80,.46),
    0 16px 34px -14px rgba(41,27,80,.22);
}
.slot--side .frame{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.2),
    inset 0 0 0 1px rgba(255,255,255,.06),
    0 32px 52px -26px rgba(41,27,80,.34);
}
.glass{
  position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;
  background:#e2eed1;display:flex;flex-direction:column;
}
.glass--map{display:block}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:108px;height:31px;border-radius:16px;background:#0d0919;z-index:70;
}

/* ---------- icons ---------- */
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* ---------- status bar ---------- */
.sbar{
  height:50px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 8px;color:#fff;flex:none;position:relative;z-index:40;
}
.sbar__t{font-family:var(--brand);font-size:15px;font-weight:600;letter-spacing:.01em}
.sbar__r{display:flex;align-items:center;gap:6px}

/* ---------- header ---------- */
.hdr{
  position:absolute;top:0;inset-inline:0;z-index:35;
  background:linear-gradient(172deg,var(--navy-2) 0%,var(--navy) 62%,#2e2056 100%);
  border-radius:0 0 26px 26px;
  padding:0 18px 16px;
  box-shadow:0 10px 26px -14px rgba(41,27,80,.5);
}
.hdr__top{display:flex;align-items:center;gap:10px;height:40px}
.mark{
  width:36px;height:36px;border-radius:12px;background:var(--pink);
  display:grid;place-items:center;color:#fff;flex:none;
  box-shadow:0 4px 12px -3px rgba(232,49,138,.6);
}
.mark .ic{width:21px;height:21px;stroke-width:1.7}
.switch{
  display:flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(255,255,255,.12);
}
.switch__o{
  font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.005em;
  padding:6px 13px;border-radius:999px;color:rgba(255,255,255,.6);white-space:nowrap;
}
.switch__o.on{background:#fff;color:var(--navy)}
.hdr__btn{
  margin-inline-start:auto;width:36px;height:36px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;
}
.hdr__btn .ic{width:19px;height:19px}
.search{
  margin-top:12px;height:42px;border-radius:14px;background:rgba(255,255,255,.13);
  display:flex;align-items:center;gap:9px;padding:0 13px;color:rgba(255,255,255,.62);
}
.search .ic{width:17px;height:17px}
.search span{font-size:13.5px;font-weight:500}

/* ---------- map surface ---------- */
.mapwrap{position:absolute;inset:0;z-index:5}
.map{position:absolute;inset:0;width:100%;height:100%;display:block}

/* chips */
.chips{
  position:absolute;top:172px;inset-inline:0;z-index:20;
  display:flex;gap:6px;padding-inline:16px;overflow:hidden;
}
.chip{
  display:flex;align-items:center;gap:5px;flex:none;height:35px;padding:0 12px;
  border-radius:999px;background:#fff;color:#453a63;
  font-size:12.5px;font-weight:600;white-space:nowrap;
  box-shadow:0 3px 10px -3px rgba(41,27,80,.22),0 0 0 1px rgba(41,27,80,.04);
}
.chip .ic{width:14px;height:14px;stroke-width:2}
.chip.on{background:var(--pink);color:#fff;box-shadow:0 5px 14px -4px rgba(232,49,138,.55)}

/* filter context */
.fctx{
  position:absolute;top:217px;inset-inline:18px;z-index:20;height:36px;
  display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;
  border-radius:12px;background:#fdeaf3;
  box-shadow:0 3px 10px -4px rgba(232,49,138,.3),0 0 0 1px rgba(232,49,138,.1);
}
.fctx__av{
  width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;flex:none;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;
}
.fctx__t{font-size:12px;font-weight:600;color:#b62070;letter-spacing:.005em}
.fctx__x{margin-inline-start:auto;width:22px;height:22px;display:grid;place-items:center;color:#c9538f}
.fctx__x .ic{width:12px;height:12px;stroke-width:2.2}

/* map controls */
.mctl{position:absolute;left:16px;top:424px;z-index:18;display:flex;flex-direction:column;gap:9px}
.mctl__b{
  width:38px;height:38px;border-radius:13px;background:#fff;display:grid;place-items:center;
  color:var(--navy);box-shadow:0 4px 12px -3px rgba(41,27,80,.24),0 0 0 1px rgba(41,27,80,.04);
}
.mctl__b .ic{width:18px;height:18px}
.mctl__b.acc{color:var(--sky)}

/* pins layer */
.pins{position:absolute;inset:0;z-index:14}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.bdg{
  display:flex;align-items:center;gap:5px;background:#fff;
  border-radius:999px;padding:3.5px 8px 3.5px 7px;margin-bottom:5px;
  font-family:var(--brand);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  box-shadow:0 4px 10px -3px rgba(41,27,80,.28),0 0 0 1px rgba(41,27,80,.05);
  white-space:nowrap;
}
.bdg i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;display:block}
.bdg--s{color:#54862f} .bdg--m{color:#b3700f} .bdg--l{color:#cc2278}
.pdot{
  width:36px;height:36px;border-radius:50% 50% 50% 50%;display:grid;place-items:center;
  color:#fff;border:3px solid #fff;position:relative;
  box-shadow:0 5px 12px -3px rgba(41,27,80,.4);
}
.pdot .ic{width:18px;height:18px;stroke-width:2}
.pdot::after{
  content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border:5px solid transparent;border-top-color:#fff;
}
.pdot--pink{background:var(--pink)} .pdot--teal{background:var(--teal)}
.pdot--orange{background:var(--orange)} .pdot--lime{background:var(--lime)}
.pdot--off{
  width:29px;height:29px;background:#fff;border-color:#ded7ea;color:#b6adc9;
  box-shadow:0 3px 8px -3px rgba(41,27,80,.2);
}
.pdot--off .ic{width:14px;height:14px}
.pdot--off::after{border-top-color:#ded7ea;bottom:-5px;border-width:4px}
.pin--sel .pdot{width:46px;height:46px;border-width:3.5px}
.pin--sel .pdot .ic{width:23px;height:23px}
.halo{
  position:absolute;width:70px;height:70px;border-radius:50%;
  background:rgba(232,144,30,.18);border:1.5px solid rgba(232,144,30,.32);
  transform:translate(-50%,-50%);z-index:12;
}
.namepill{
  position:absolute;transform:translate(-50%,0);z-index:16;
  background:#fff;border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap;
  box-shadow:0 5px 13px -4px rgba(41,27,80,.3),0 0 0 1px rgba(41,27,80,.05);
}
.amen{
  position:absolute;transform:translate(-50%,-50%);z-index:13;
  width:25px;height:25px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 3px 8px -2px rgba(41,27,80,.22),0 0 0 1px rgba(41,27,80,.05);
}
.amen .ic{width:13px;height:13px;stroke-width:2.1}
.here{position:absolute;transform:translate(-50%,-50%);z-index:15}
.here__h{position:absolute;inset:-15px;border-radius:50%;background:rgba(62,160,255,.2)}
.here__d{position:relative;width:17px;height:17px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 3px 8px -1px rgba(62,160,255,.6)}

/* ---------- bottom sheet ---------- */
.sheet{
  position:absolute;inset-inline:0;bottom:76px;z-index:25;background:#fff;
  border-radius:26px 26px 0 0;padding:9px 20px 16px;
  box-shadow:0 -16px 36px -14px rgba(41,27,80,.22);
}
.grab{width:38px;height:5px;border-radius:3px;background:#e6e0ef;margin:0 auto 13px}
.sh__top{display:flex;align-items:flex-start;gap:12px}
.sh__name{font-family:var(--brand);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.15;color:var(--navy)}
.sh__sub{margin-top:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.sh__wait{
  margin-inline-start:auto;flex:none;text-align:center;border-radius:14px;
  background:#fdf1e2;padding:7px 12px 8px;
}
.sh__wait b{display:block;font-family:var(--brand);font-size:19px;font-weight:600;color:#b3700f;line-height:1}
.sh__wait span{display:block;margin-top:3px;font-size:10.5px;font-weight:600;color:#bb8544}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;
  background:var(--field);color:#4c4269;font-size:11.5px;font-weight:600;
}
.tag .ic{width:13px;height:13px;stroke-width:1.9;color:#8b81a6}
.tag--dry .ic{color:var(--orange)}
.meta{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:12px;font-weight:500;color:var(--muted)}
.meta .ic{width:14px;height:14px;color:#a79ebf}
.acts{display:flex;gap:9px;margin-top:14px}
.btn{
  height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:14.5px;font-weight:700;letter-spacing:.005em;
}
.btn .ic{width:17px;height:17px;stroke-width:2}
.btn--p{flex:1.5;background:var(--pink);color:#fff;box-shadow:0 8px 18px -8px rgba(232,49,138,.75)}
.btn--s{flex:1;background:#f1edf7;color:var(--navy)}

/* ---------- bottom nav ---------- */
.nav{
  flex:none;height:76px;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:9px 6px 0;position:relative;z-index:30;
}
.nav__i{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a79ec0;position:relative}
.nav__i span{font-size:10.5px;font-weight:600;letter-spacing:.005em}
.nav__i .ic{width:23px;height:23px}
.nav__i.on{color:var(--pink)}
.glass--map .nav{position:absolute;bottom:0;inset-inline:0}
.nav__b{
  position:absolute;top:-3px;inset-inline-start:calc(50% + 6px);
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--pink);color:#fff;
  font-family:var(--brand);font-size:10px;font-weight:600;display:grid;place-items:center;
  border:2px solid #fff;
}
.homebar{
  position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:rgba(43,31,77,.2);
}

/* ---------- screen B : results ---------- */
.hdrB{
  flex:none;position:relative;z-index:20;
  background:linear-gradient(172deg,var(--navy-2) 0%,var(--navy) 70%);
  border-radius:0 0 24px 24px;padding:0 18px 15px;
}
.hdrB__row{display:flex;align-items:center;gap:11px;height:38px;color:#fff}
.hdrB__row .ic{width:20px;height:20px;stroke-width:2.1}
.hdrB__t{font-family:var(--brand);font-size:17px;font-weight:500;letter-spacing:-.005em}
.kid{

  border-radius:15px;background:rgba(255,255,255,.12);padding:0 12px;
}
.kid__av{width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.kid__n{font-size:13.5px;font-weight:700;color:#fff}
.kid__d{font-size:11.5px;font-weight:500;color:rgba(255,255,255,.62);margin-top:1px}
.kid__e{margin-inline-start:auto;font-size:12px;font-weight:700;color:#ff9ac9}
.listwrap{flex:1;min-height:0;background:#faf8fc;padding:14px 16px 0;overflow:hidden}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.lhead__c{font-size:12px;font-weight:600;color:var(--muted)}
.lhead__c b{color:var(--navy);font-weight:700}
.sort{margin-inline-start:auto;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--navy)}
.sort .ic{width:12px;height:12px;stroke-width:2.3}
.rc{
  display:flex;align-items:center;gap:11px;background:#fff;border-radius:17px;
  padding:11px;margin-bottom:9px;box-shadow:0 2px 8px -3px rgba(41,27,80,.13),0 0 0 1px rgba(41,27,80,.035);
}
.rc__th{width:54px;height:54px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff}
.rc__th .ic{width:26px;height:26px;stroke-width:1.9}
.th--lime{background:#8fcf62} .th--sky{background:#5cb0ff} .th--orange{background:#eda03c}
.th--teal{background:#3ec3c3} .th--pink{background:#ec4f9b}
.th--off{background:#eeeaf4;color:#b3aac8}
.rc__b{min-width:0;flex:1}
.rc__n{font-size:14.5px;font-weight:700;color:var(--navy);letter-spacing:-.005em}
.rc__m{margin-top:3px;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc__m.warn{color:#c05a12;font-weight:600}
.wp{flex:none;min-width:46px;text-align:center;border-radius:12px;padding:6px 8px 7px}
.wp b{display:block;font-family:var(--brand);font-size:15px;font-weight:600;line-height:1}
.wp span{display:block;margin-top:2px;font-size:9.5px;font-weight:600;opacity:.8}
.wp--s{background:#eef8e4;color:#4d7d2a} .wp--m{background:#fdf1e2;color:#a9670f} .wp--l{background:#fdeaf3;color:#c01e70}
.rc--off{box-shadow:none;background:#f4f1f8;border:1px dashed #ddd5e9}
.rc--off .rc__n{color:#7d7396}
.rc__lock{flex:none;width:34px;height:34px;border-radius:11px;background:#eae5f1;display:grid;place-items:center;color:#a79ec0}
.rc__lock .ic{width:16px;height:16px}
.split{display:flex;align-items:center;gap:9px;margin:16px 0 11px}
.split::before,.split::after{content:"";height:1px;background:#e6e0ef;flex:1}
.split span{font-size:11px;font-weight:700;color:#9990b0;letter-spacing:.01em}

/* ---------- screen C : ride detail ---------- */
.hero{position:relative;height:238px;flex:none}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero__bar{position:absolute;top:50px;inset-inline:16px;display:flex;align-items:center;z-index:5}
.rbtn{
  width:36px;height:36px;border-radius:12px;background:rgba(21,14,42,.34);
  display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px);
}
.rbtn .ic{width:19px;height:19px;stroke-width:2.1}
.rbtn--l{margin-inline-start:auto}
.sheetC{
  position:relative;z-index:6;margin-top:-26px;background:#fff;
  border-radius:26px 26px 0 0;padding:20px 20px 0;flex:1;min-height:0;
}
.live{display:inline-flex;align-items:center;gap:6px;background:#eef8e4;color:#4d7d2a;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.live i{width:7px;height:7px;border-radius:50%;background:#6fbb3a;display:block}
.rtitle{margin-top:11px;font-family:var(--brand);font-size:25px;font-weight:600;letter-spacing:-.015em;color:var(--navy);line-height:1.1}
.rsub{margin-top:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
.rdesc{margin-top:12px;font-size:13px;font-weight:400;line-height:1.62;color:var(--ink-2)}
.stats{display:flex;margin-top:16px;border-radius:17px;background:var(--field);padding:13px 0}
.stat{flex:1;text-align:center;padding:0 4px}
.stat+.stat{border-inline-start:1px solid #e8e2f0}

.stat span{display:block;margin-top:4px;font-size:10.5px;font-weight:600;color:var(--muted)}

.krow{display:flex;align-items:center;gap:11px;margin-top:12px}

.ki--dry{background:#fdf1e2;color:#b3700f}
.ki--info{background:#eaf3fd;color:#2a72b8}
.ktext{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.4}
.ktext em{font-style:normal;color:var(--navy);font-weight:700}
.ctabar{
  position:absolute;inset-inline:0;bottom:76px;z-index:20;background:#fff;
  border-top:1px solid var(--line);padding:12px 20px 14px;display:flex;gap:9px;
}

/* ===================== prototype layer ===================== */
/* interactive affordances (buttons reset to the mockup's look) */
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
.pin,.chip,.switch__o,.mctl__b,.btn,.nav__i,.fctx__x,.hdr__btn,.rbtn,.rc{cursor:pointer}
.pin:focus-visible,.chip:focus-visible,.switch__o:focus-visible,.mctl__b:focus-visible,
.btn:focus-visible,.fctx__x:focus-visible,.rc:focus-visible{
  outline:2.5px solid #6f4fd8;outline-offset:3px;border-radius:14px;
}
.pin:focus-visible{outline-offset:6px}
.glass{touch-action:manipulation;user-select:none}

/* map pans a touch between the two parks */
.map{transition:transform .72s cubic-bezier(.33,.9,.28,1)}
.is-super .map{transform:scale(1.05) translate(-9px,12px)}

/* pins: mute / select / park crossfade */
.pins{transition:opacity .26s ease}
.pins.is-swap{opacity:0}
.pdot{
  transition:background-color .42s ease,border-color .42s ease,color .42s ease,
             transform .42s cubic-bezier(.34,1.4,.5,1),box-shadow .42s ease;
}
.pdot::after{transition:border-color .42s ease}
.pin.is-off .pdot{
  background:#fff;border-color:#dbd3ea;color:#a396c0;transform:scale(.8);
  box-shadow:0 3px 8px -3px rgba(41,27,80,.2);
}
.pin.is-off .pdot::after{border-top-color:#ded7ea}
.pin.is-sel .pdot{transform:scale(1.3)}
.pin .bdg{transition:opacity .34s ease,transform .34s ease,color .42s ease,margin-bottom .42s cubic-bezier(.34,1.4,.5,1)}
.pin.is-sel .bdg{margin-bottom:12px}
.pin.is-off .bdg{opacity:0;transform:translateY(6px) scale(.9);pointer-events:none}
.bdg.is-tick .bdgn{animation:tick .42s ease}
@keyframes tick{35%{opacity:.35;transform:translateY(-2px)}}
.bdgn{display:inline-block}
.num{font-style:normal;display:inline;color:inherit;font:inherit}
.rc__b,.rc__n,.rc__m{display:block}

.halo{
  opacity:0;transform:translate(-50%,-50%) scale(.55);
  transition:opacity .38s ease,transform .46s cubic-bezier(.34,1.4,.5,1);
}
.halo.is-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.namepill{
  opacity:0;transform:translate(-50%,-6px) scale(.94);pointer-events:none;
  transition:opacity .3s ease,transform .38s cubic-bezier(.34,1.4,.5,1);
}
.namepill.is-on{opacity:1;transform:translate(-50%,0) scale(1)}

/* chip press feedback */
.chip{transition:background-color .3s ease,color .3s ease,box-shadow .3s ease}
.chip.is-press{animation:press .34s cubic-bezier(.34,1.5,.5,1)}
@keyframes press{40%{transform:scale(.93)}}

/* park switch pill */
.switch__o{transition:background-color .3s ease,color .3s ease}

/* filter banner */
.fctx{
  opacity:0;transform:translateY(-9px) scale(.97);pointer-events:none;
  transition:opacity .3s ease,transform .38s cubic-bezier(.34,1.35,.5,1);
}
.fctx.is-on{opacity:1;transform:none;pointer-events:auto}

/* bottom sheet */
.sheet{
  transform:translateY(112%);
  transition:transform .5s cubic-bezier(.3,.9,.25,1);
  will-change:transform;
}
.sheet.is-on{transform:translateY(0)}
.sh__wait{transition:background-color .42s ease}
.sh__wait b{transition:color .42s ease}
.sh__wait.is-tick b{animation:tick .42s ease}
.meta--warn{color:#c05a12;font-weight:600}
.meta--warn .ic{color:#d4761f}
.btn--off{opacity:.42}

/* screen B list + screen C detail keep in sync with the data */
.wp b{transition:color .42s ease}
.rc{width:100%}

/* ===================== solo / embed mode ===================== */
body.is-solo{position:fixed;inset:0;margin:0;padding:0;min-height:0;overflow:hidden;display:grid;place-items:center}
body.is-solo .unit--side,body.is-solo .cap{display:none}
body.is-solo .rig{gap:0;zoom:1}
body.is-solo .unit{gap:0}
body.is-solo .slot--hero{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center center;
}

/* ===================== reduced motion ===================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
}

        wait:9, walk:6, cycle:'יציאה כל 8 דקות', x:292, y:380, badge:false,
        desc:'רכבת נופש שמקיפה את הפארק ועוצרת בשלוש תחנות.' },
      { id:'kingdom', name:'ממלכת הפעוטות', cat:'tots', area:'כיכר הכפר',
        minH:0, maxH:130, minAge:2, wet:false, intensity:'עוצמה נמוכה', dur:'ללא הגבלה',
        wait:6, walk:7, cycle:'כניסה חופשית', x:306, y:482, badge:true,
        desc:'מתחם משחק מקורה לפעוטות, עם מתקנים רכים ופינת הורים.' }
    ]
  }
};

/* per-ride drift range so numbers stay plausible */
Object.keys(PARKS).forEach(function(k){
  PARKS[k].rides.forEach(function(r){
    r.base = r.wait;
    r.lo = Math.max(3, r.wait - 7);
    r.hi = r.wait + 8;
  });
});

var FILTERS = {
  kid:    function(r){ return fitsChild(r); },
  short:  function(r){ return r.wait <= 15; },
  dry:    function(r){ return !r.wet; },
  tots:   function(r){ return r.minAge <= 3; },
  thrill: function(r){ return r.cat === 'thrill'; }
};

function fitsChild(r){
  if (r.minH && CHILD.height < r.minH) return false;
  if (r.maxH && CHILD.height > r.maxH) return false;
  if (r.minAge && CHILD.age < r.minAge) return false;
  return true;
}
function childReason(r){
  if (r.minH && CHILD.height < r.minH)
    return 'נמוך ב-' + (r.minH - CHILD.height) + ' ס״מ מהגובה הנדרש · ' + r.minH + ' ס״מ';
  if (r.maxH && CHILD.height > r.maxH) return 'מיועד לילדים עד ' + r.maxH + ' ס״מ';
  if (r.minAge && CHILD.age < r.minAge)
    return 'גיל מינימלי ' + r.minAge + (r.minH ? ' · גובה ' + r.minH + ' ס״מ+' : '');
  return '';
}
function tier(w){ return w <= 10 ? 's' : (w <= 30 ? 'm' : 'l'); }
function icon(n){ return '<svg class="ic"><use href="#i-' + n + '"/></svg>'; }
function heightLabel(r){
  if (r.maxH) return 'גובה עד ' + r.maxH + ' ס״מ';
  if (r.minH) return 'גובה ' + r.minH + ' ס״מ+';
  return 'ללא מגבלת גובה';
}
function ageLabel(r){ return r.minAge ? 'מגיל ' + r.minAge : 'כל הגילאים'; }

/* ---------------- state ---------------- */

var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var state = { park:'luna', filters:{}, selected:null };

var $  = function(s){ return document.querySelector(s); };
var el = {
  phone:$('#phone'), pins:$('#pins'), chips:$('#chips'), fctx:$('#fctx'),
  sheet:$('#sheet'), shName:$('#shName'), shSub:$('#shSub'),
  shWait:$('#shWait'), shWaitN:$('#shWaitN'), shTags:$('#shTags'),
  shMeta:$('#shMeta'), shCta:$('#shCta'),
  listCount:$('#listCount'), listBody:$('#listBody'),
  dTitle:$('#dTitle'), dSub:$('#dSub'), dDesc:$('#dDesc'), dWait:$('#dWait'),
  dDur:$('#dDur'), dH:$('#dH'), dKnow:$('#dKnow'),
  zone:$('#zoneLabel'), map:$('.map')
};

function park(){ return PARKS[state.park]; }
function rides(){ return park().rides; }
function rideById(id){
  var rs = rides();
  for (var i=0;i<rs.length;i++) if (rs[i].id === id) return rs[i];
  return null;
}
function activeFilters(){ return Object.keys(state.filters).filter(function(k){ return state.filters[k]; }); }
function passes(r){
  var fs = activeFilters();
  for (var i=0;i<fs.length;i++) if (!FILTERS[fs[i]](r)) return false;
  return true;
}
function filtering(){ return activeFilters().length > 0; }

/* ---------------- map pins ---------------- */

function buildPins(){
  var p = park(), html = '';

  p.rides.forEach(function(r){
    var c = CAT[r.cat];
    html +=
      '<div class="halo" data-halo="'+r.id+'" style="left:'+r.x+'px;top:'+(r.y-23)+'px;'+
        'background:rgba('+c.rgb+',.18);border-color:rgba('+c.rgb+',.34)"></div>' +
      '<button type="button" class="pin" data-ride="'+r.id+'" style="left:'+r.x+'px;top:'+r.y+'px" aria-label="'+r.name+'">' +
        (r.badge ? '<span class="bdg bdg--'+tier(r.wait)+'" data-bdg="'+r.id+'"><i></i><span class="bdgn">'+r.wait+'</span> דק׳</span>' : '') +
        '<span class="pdot pdot--'+c.color+'">'+icon(c.icon)+'</span>' +
      '</button>' +
      '<div class="namepill" data-name="'+r.id+'" style="left:'+r.x+'px;top:'+(r.y+8)+'px">'+r.name+'</div>';
  });

  p.amen.forEach(function(a){
    html += '<div class="amen" style="left:'+a.x+'px;top:'+a.y+'px;color:'+a.color+'">'+icon(a.icon)+'</div>';
  });
  html += '<div class="here" style="left:'+p.here.x+'px;top:'+p.here.y+'px"><div class="here__h"></div><div class="here__d"></div></div>';

  el.pins.innerHTML = html;
  if (el.zone) el.zone.textContent = p.zone;
  syncPins();
}

function syncPins(){
  var on = filtering();
  rides().forEach(function(r){
    var pin  = el.pins.querySelector('[data-ride="'+r.id+'"]');
    var halo = el.pins.querySelector('[data-halo="'+r.id+'"]');
    var name = el.pins.querySelector('[data-name="'+r.id+'"]');
    if (!pin) return;
    var sel = state.selected === r.id;
    pin.classList.toggle('is-off', on && !passes(r));
    pin.classList.toggle('is-sel', sel);
    if (halo) halo.classList.toggle('is-on', sel);
    if (name) name.classList.toggle('is-on', sel);
  });
}

/* animated number swap */
function setNum(node, to, box){
  if (!node) return;
  if (node._raf){ cancelAnimationFrame(node._raf); node._raf = 0; }
  var from = parseInt(node.textContent, 10);
  if (isNaN(from) || REDUCED || from === to){ node.textContent = to; return; }
  if (box){ box.classList.remove('is-tick'); void box.offsetWidth; box.classList.add('is-tick'); }
  var t0 = null, dur = 420;
  function step(t){
    if (t0 === null) t0 = t;
    var k = (t - t0) / dur;
    if (k < 0) k = 0;
    if (k >= 1){ node.textContent = to; node._raf = 0; return; }
    node.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    node._raf = requestAnimationFrame(step);
  }
  node._raf = requestAnimationFrame(step);
}

function tickWaits(){
  var deltas = [-3,-2,-1,-1,0,1,1,2,3];
  rides().forEach(function(r){
    var d = deltas[Math.floor(Math.random() * deltas.length)];
    r.wait = Math.max(r.lo, Math.min(r.hi, r.wait + d));
  });
  refreshWaits();
}

function refreshWaits(){
  rides().forEach(function(r){
    var bdg = el.pins.querySelector('[data-bdg="'+r.id+'"]');
    if (bdg){
      bdg.className = 'bdg bdg--' + tier(r.wait);
      setNum(bdg.querySelector('.bdgn'), r.wait, bdg);
    }
    var wp = el.listBody.querySelector('[data-wp="'+r.id+'"]');
    if (wp){
      wp.className = 'wp wp--' + tier(r.wait);
      setNum(wp.querySelector('b'), r.wait);
    }
  });
  var sel = state.selected && rideById(state.selected);
  if (sel) setNum(el.shWaitN, sel.wait, el.shWait);
  var feat = rideById(park().featured);
  if (feat) setNum(el.dWait, feat.wait);
}

/* ---------------- bottom sheet ---------------- */

function renderSheet(r){
  var c = CAT[r.cat];
  el.shName.textContent = r.name;
  el.shSub.textContent  = c.label + ' · ' + r.area;
  el.shWaitN.textContent = r.wait;

  el.shTags.innerHTML =
    '<span class="tag">'+icon('height')+heightLabel(r)+'</span>' +
    '<span class="tag">'+icon('age')+ageLabel(r)+'</span>' +
    '<span class="tag tag--dry">'+icon(r.wet ? 'wet' : 'dry')+(r.wet ? 'רטוב' : 'יבש')+'</span>' +
    '<span class="tag">'+icon('bolt')+r.intensity+'</span>';

  var blocked = state.filters.kid && !fitsChild(r);
  el.shMeta.className = 'meta' + (blocked ? ' meta--warn' : '');
  el.shMeta.innerHTML = blocked
    ? icon('height') + childReason(r)
    : icon('walk') + r.walk + ' דק׳ הליכה ממך · ' + r.cycle;
  el.shCta.classList.toggle('btn--off', blocked);
}

function openSheet(id){
  var r = rideById(id);
  if (!r) return;
  state.selected = id;
  renderSheet(r);
  el.sheet.classList.add('is-on');
  syncPins();
}
function closeSheet(){
  state.selected = null;
  el.sheet.classList.remove('is-on');
  syncPins();
}

/* ---------------- screen B : results list ---------------- */

function renderList(){
  var rs = rides().slice().sort(function(a,b){ return a.wait - b.wait; });
  var ok = rs.filter(fitsChild), no = rs.filter(function(r){ return !fitsChild(r); });

  el.listCount.innerHTML = '<b>' + park().fit + '</b> מתוך ' + park().total +
                           ' מתקנים מתאימים ל' + CHILD.name;

  var html = ok.map(function(r){
    var c = CAT[r.cat];
    return '<button type="button" class="rc" data-open="'+r.id+'">' +
      '<span class="rc__th '+c.th+'">'+icon(c.icon)+'</span>' +
      '<span class="rc__b"><span class="rc__n">'+r.name+'</span>' +
      '<span class="rc__m">'+heightLabel(r)+' · '+(r.wet?'רטוב':'יבש')+' · '+c.label.replace('מתקן ','')+'</span></span>' +
      '<span class="wp wp--'+tier(r.wait)+'" data-wp="'+r.id+'"><b>'+r.wait+'</b><span>דק׳</span></span>' +
    '</button>';
  }).join('');

  if (no.length){
    html += '<div class="split"><span>לא מתאים ל'+CHILD.name+' כרגע</span></div>';
    html += no.map(function(r){
      return '<button type="button" class="rc rc--off" data-open="'+r.id+'">' +
        '<span class="rc__th th--off">'+icon(CAT[r.cat].icon)+'</span>' +
        '<span class="rc__b"><span class="rc__n">'+r.name+'</span>' +
        '<span class="rc__m warn">'+childReason(r)+'</span></span>' +
        '<span class="rc__lock">'+icon(r.minH && CHILD.height < r.minH ? 'height' : 'age')+'</span>' +
      '</button>';
    }).join('');
  }
  el.listBody.innerHTML = html;
}

/* ---------------- screen C : ride detail ---------------- */

function renderDetail(){
  var r = rideById(park().featured);
  if (!r) return;
  el.dTitle.textContent = r.name;
  el.dSub.textContent   = CAT[r.cat].label + ' · ' + r.area + ' · ' + park().name;
  el.dDesc.textContent  = r.desc;
  el.dWait.textContent  = r.wait;
  el.dDur.textContent   = r.dur;
  el.dH.textContent     = r.minH ? r.minH + ' ס״מ' : 'ללא';

  var gap = CHILD.height - r.minH;
  el.dKnow.innerHTML =
    '<div class="krow"><div class="kicon ki--ok">'+icon('check')+'</div>' +
      '<div class="ktext">מתאים ל<em>'+CHILD.name+'</em> · '+CHILD.height+' ס״מ, גבוה ב-'+gap+' ס״מ מהנדרש</div></div>' +
    '<div class="krow"><div class="kicon ki--dry">'+icon(r.wet?'wet':'dry')+'</div>' +
      '<div class="ktext">'+(r.wet?'רטוב · כדאי בגדים להחלפה':'יבש לחלוטין · לא צריך בגדים להחלפה')+'</div></div>' +
    '<div class="krow"><div class="kicon ki--info">'+icon('info')+'</div>' +
      '<div class="ktext">ילדים עד גיל 8 בליווי מבוגר</div></div>' +
    '<div class="krow"><div class="kicon ki--ok">'+icon('ticket')+'</div>' +
      '<div class="ktext">כלול בכרטיס הכניסה · אין צורך בתשלום נוסף</div></div>';
}

/* ---------------- filters ---------------- */

function setFilter(key, on, animatePress){
  state.filters[key] = on;
  var chip = el.chips.querySelector('[data-f="'+key+'"]');
  if (chip){
    chip.classList.toggle('on', on);
    if (animatePress && !REDUCED){
      chip.classList.remove('is-press'); void chip.offsetWidth; chip.classList.add('is-press');
    }
  }
  if (key === 'kid') el.fctx.classList.toggle('is-on', on);
  syncPins();
  var sel = state.selected && rideById(state.selected);
  if (sel) renderSheet(sel);
}

function clearFilters(){
  Object.keys(FILTERS).forEach(function(k){ setFilter(k, false); });
}

function switchPark(id){
  if (state.park === id) return;
  state.park = id;
  document.body.classList.toggle('is-super', id === 'super');
  Array.prototype.forEach.call(document.querySelectorAll('.switch__o'), function(b){
    b.classList.toggle('on', b.dataset.park === id);
  });
  closeSheet();
  el.pins.classList.add('is-swap');
  var swap = function(){
    buildPins(); renderList(); renderDetail();
    el.pins.classList.remove('is-swap');
  };
  REDUCED ? swap() : setTimeout(swap, 240);
}

/* ---------------- the auto loop ---------------- */

var CYCLE = 11200;
var timers = [];
var waitTimer = null;
var idleTimer = null;
var auto = true;

function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function loop(){
  clearAll();
  /* 0.0s — clean slate */
  clearFilters();
  closeSheet();
  /* 2.0s — the child filter turns itself on */
  at(2000, function(){ setFilter('kid', true, true); });
  /* 4.4s — the featured ride's card rises */
  at(4400, function(){ openSheet(park().featured); });
  /* 9.0s — card goes back down */
  at(9000, closeSheet);
  /* 10.0s — filter clears, map returns to rest */
  at(10000, function(){ setFilter('kid', false); });
  /* 11.2s — round again */
  at(CYCLE, loop);
}

function startAuto(){
  if (REDUCED) return;
  auto = true;
  loop();
}
function stopAuto(){
  if (!auto) { armIdle(); return; }
  auto = false;
  clearAll();
  armIdle();
}
function armIdle(){
  if (REDUCED) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ if (!auto) startAuto(); }, 15000);
}

/* ---------------- wiring ---------------- */

el.phone.addEventListener('pointerdown', stopAuto, true);

el.pins.addEventListener('click', function(e){
  var pin = e.target.closest('[data-ride]');
  if (!pin) return;
  var id = pin.dataset.ride;
  state.selected === id ? closeSheet() : openSheet(id);
});

el.chips.addEventListener('click', function(e){
  var chip = e.target.closest('[data-f]');
  if (!chip) return;
  var k = chip.dataset.f;
  setFilter(k, !state.filters[k], true);
});

el.fctx.querySelector('#fctxX').addEventListener('click', function(){ setFilter('kid', false); });

Array.prototype.forEach.call(document.querySelectorAll('.switch__o'), function(b){
  b.addEventListener('click', function(){ switchPark(b.dataset.park); });
});

el.listBody.addEventListener('click', function(e){
  var row = e.target.closest('[data-open]');
  if (!row) return;
  stopAuto();
  openSheet(row.dataset.open);
});

el.sheet.querySelector('.grab').addEventListener('click', closeSheet);

/* ---------------- solo / embed fit ---------------- */

var solo = /[?#&]solo/.test(location.search + location.hash) ||
           window.self !== window.top ||
           window.innerWidth < 900;

function fit(){
  if (!solo) return;
  var s = Math.min(window.innerWidth / 416, window.innerHeight / 870);
  document.body.style.setProperty('--fit', Math.min(s, 1.35).toFixed(4));
}
if (solo){ document.body.classList.add('is-solo'); fit(); window.addEventListener('resize', fit); }

/* ---------------- boot ---------------- */

buildPins();
renderList();
renderDetail();

if (REDUCED){
  /* no motion: land straight on the state the mockup shows */
  setFilter('kid', true);
  openSheet(park().featured);
  auto = false;
} else {
  waitTimer = setInterval(tickWaits, 2600);
  startAuto();
}

})();
</script>
